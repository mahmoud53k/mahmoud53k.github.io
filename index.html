  <style>
    :root { color-scheme: dark; --bg:#07111d; --card:rgba(8,18,32,.58); --muted:#b1bfce; --white:#f5f9ff; --line:rgba(204,232,255,.17); }
    * { box-sizing:border-box }
    body { position:relative; isolation:isolate; margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 18px; color:var(--white); background:var(--bg); font-family:'Tajawal','DM Sans',sans-serif; overflow-x:hidden; }
    body:before, body:after { content:""; position:fixed; inset:-24px; z-index:-1; pointer-events:none; }
    body:before { background:url("background.jpeg") center 42% / cover no-repeat; filter:blur(13px) brightness(.38) saturate(1.12); transform:scale(1.045); }
    body:after { background:linear-gradient(140deg,rgba(4,11,22,.48),rgba(7,27,43,.32) 52%,rgba(3,11,22,.62)),radial-gradient(ellipse at 78% 19%,rgba(34,161,220,.21),transparent 46%); }
    .card { position:relative; z-index:1; width:min(100%,470px); padding:52px 34px 30px; text-align:center; border:1px solid var(--line); border-radius:30px; background:linear-gradient(145deg,rgba(12,27,45,.82),rgba(7,17,30,.72)); box-shadow:0 30px 90px #0008; backdrop-filter:blur(20px); overflow:hidden; }
    .card:before { content:""; position:absolute; width:180px;height:180px; top:-120px;left:calc(50% - 90px); border-radius:50%; background:#35bde0; filter:blur(80px); opacity:.34; }
    .avatar { position:relative; display:grid; place-items:center; width:94px;height:94px; margin:0 auto 22px; border:1px solid #d7f5ff66; border-radius:28px; background:linear-gradient(145deg,#9beaff,#5daee9 55%,#3269a8); color:#071523; font-size:42px;font-weight:800; box-shadow:0 12px 35px #3fbee544; }
    .eyebrow { margin:0 0 8px; color:#a4e7fa; font-size:14px; font-weight:600; letter-spacing:.04em }
    h1 { margin:0; font-size:clamp(35px,9vw,48px); line-height:1.2; font-weight:800; letter-spacing:-.03em }
    .bio { max-width:320px; margin:13px auto 30px; color:var(--muted); font-size:17px; line-height:1.7 }
    .links { display:grid; gap:12px; text-align:right }
    .link { display:flex; align-items:center; gap:14px; min-height:67px; padding:11px 14px; color:var(--white); text-decoration:none; border:1px solid var(--line); border-radius:17px; background:var(--card); transition:transform .2s,border-color .2s,background .2s }
    .link:hover { transform:translateY(-2px); border-color:#ffffff55; background:#ffffff0d }
    .icon { display:grid; place-items:center; flex:0 0 42px;height:42px;border-radius:13px;background:#ffffff10 }
    .icon svg { width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round }
    .wa { color:#58df91 } .ig { color:#f4a3cd } .sc { color:#ffe66d }
    .text { flex:1; min-width:0 }
    .label { display:block; font-size:16px;font-weight:700 }
    .handle { display:block; margin-top:2px; color:var(--muted); direction:ltr; text-align:right; font:13px 'DM Sans',sans-serif; overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
    .arrow { color:#777d8c; font-size:22px; direction:ltr }
    .call { display:flex; align-items:center;justify-content:center;gap:10px; margin-top:23px; min-height:58px; width:100%; border-radius:16px; color:#071523;background:linear-gradient(100deg,#a9eaff,#77d8e2); text-decoration:none;font:700 17px 'DM Sans','Tajawal',sans-serif;transition:filter .2s,transform .2s }
    .call:hover { filter:brightness(1.06); transform:translateY(-2px) }
    .call svg { width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round }
    footer { margin-top:25px;color:#737988;font:12px 'DM Sans','Tajawal',sans-serif }
    @media(max-width:400px) { .card{padding:40px 22px 25px;border-radius:25px}.bio{margin-bottom:24px} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{transition:none!important} }
  </style>
</head>
